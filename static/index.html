<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filmmate</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>
<div class="app">
  <header class="brand-mini">
    <span class="logo">🎬</span>
    <h1>Filmmate</h1>
  </header>

  <main id="chat" class="chat">
    <div id="messages"></div>
  </main>

  <footer class="composer-wrap">
    <div id="libraryPanel" class="library-panel hidden">
      <div class="lib-head"><span>我的灵感库</span><button id="libClose" class="sc-remove">✕</button></div>
      <div class="lib-form">
        <input id="libUrl" placeholder="Bilibili 链接">
        <input id="libTitle" placeholder="片名（可选）">
        <input id="libMoods" placeholder="情绪标签，如：孤独, 浪漫">
        <input id="libScriptFile" type="file" accept=".pdf,.docx,.txt,.md" hidden>
        <button id="libScriptBtn" class="chip" type="button">＋剧本</button>
        <span id="libScriptName" class="lib-script-name"></span>
        <button id="libAdd" class="send-btn">添加</button>
      </div>
      <div id="libList" class="lib-list"></div>
    </div>
    <div id="scriptChip" class="script-chip hidden">
      <span class="sc-icon">📄</span>
      <span id="scriptName" class="sc-name"></span>
      <span id="scriptMeta" class="sc-meta"></span>
      <button id="scriptRemove" class="sc-remove" title="移除剧本">✕</button>
    </div>
    <div class="tools-row" id="toolsRow">
      <button class="chip chip-tool active" data-tool="">智能问答</button>
      <button class="chip chip-tool" data-tool="review">剧本检查</button>
      <button class="chip chip-tool" data-tool="storyboard">分镜建议</button>
      <button class="chip chip-tool" data-tool="rundown">Rundown</button>
      <button class="chip chip-tool" data-tool="schedule">日程规划</button>
      <button class="chip chip-tool" data-tool="inspiration">灵感</button>
      <button class="chip chip-tool" data-tool="library">我的库</button>
    </div>
    <div class="composer">
      <button id="attachBtn" class="icon-btn" title="上传剧本（PDF / DOCX / TXT）">📎</button>
      <input id="fileInput" type="file" accept=".pdf,.docx,.txt,.md,.markdown,.fountain" hidden>
      <textarea id="input" rows="1" placeholder="输入想法，或先上传剧本再选功能…"></textarea>
      <button id="micBtn" class="icon-btn" title="语音输入">🎤</button>
      <button id="sendBtn" class="send-btn">→</button>
    </div>
  </footer>
</div>
<div id="frameModal" class="frame-modal hidden">
  <div class="fm-box">
    <button id="fmClose" class="sc-remove">✕</button>
    <h3 id="fmTitle"></h3>
    <div id="fmGrid" class="fm-grid"></div>
    <div id="fmLinks" class="fm-links"></div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
