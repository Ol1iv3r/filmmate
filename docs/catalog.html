  DATA.forEach(function(d){
    var hay = (d.title_zh + d.title_en + d.synopsis + d.tags.join(" ") + d.genre.join(" ") + d.moods.join(" ")).toLowerCase();
    var ok = (!state.kind || d.kind === state.kind)
      && (!state.mood || d.moods.indexOf(state.mood) >= 0)
      && (!q || q.split(/\s+/).every(function(t){ return hay.indexOf(t) >= 0; }));
    if (ok) { shown++; html += card(d); }
  });
  grid.innerHTML = html;
  countEl.textContent = "显示 " + shown + " / " + DATA.length + " 部";
  Array.prototype.forEach.call(document.querySelectorAll(".frames img"), function(img){
    img.onclick = function(){
      var lb = document.getElementById("lb");
      lb.querySelector("img").src = img.dataset.full;
      lb.style.display = "flex";
    };
  });
}
document.getElementById("lb").onclick = function(e){ e.currentTarget.style.display = "none"; };
tabs.onclick = function(e){
  var t = e.target.closest(".tab");
  if(!t) return;
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(x){ x.classList.toggle("on", x === t); });
  state.kind = t.dataset.kind; render(); window.scrollTo({top:0,behavior:"smooth"});
};
moodSel.onchange = function(){ state.mood = moodSel.value; render(); };
qInput.oninput = function(){ state.q = qInput.value; render(); };
render();
</script>
</body>
</html>
